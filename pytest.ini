[pytest]
asyncio_default_fixture_loop_scope = function
markers =
    deterministic: Локальные проверки без внешнего API.
    structured: Проверки структурированного вывода.
    llm_api: Тесты, которые вызывают Groq и требуют GROQ_API_KEY.
    llm_judge: Оценки DeepEval через Groq; требуют API-ключ и расходуют токены.
    rag: Проверки RAGAS через Groq; требуют API-ключ и расходуют токены.
